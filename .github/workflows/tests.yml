name: Testes Automatizados

on:
  push:
    branches: [main, develop, config/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  testes-api:
    name: Testes de API (Karate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "maven"

      - name: Verificar estrutura do projeto
        run: |
          echo "=== Estrutura do Projeto ==="
          ls -la
          echo "=== Conteúdo tests/api/karate ==="
          ls -la tests/api/karate/ || echo "Diretório não encontrado"
          echo "=== Features ==="
          ls -la tests/api/karate/features/ || echo "Features não encontradas"

      - name: Executar testes de API
        run: mvn clean test -Dkarate.env=ci || mvn test -X
        env:
          MAVEN_OPTS: "-Xmx1024m"

      - name: Upload relatório Karate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports
          path: target/karate-reports/
          retention-days: 30

      - name: Publicar resumo dos testes
        if: always()
        run: |
          echo "## Resultados dos Testes de API" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/karate-reports/karate-summary.html ]; then
            echo "Relatorio gerado com sucesso" >> $GITHUB_STEP_SUMMARY
            echo "Veja os artefatos para detalhes completos" >> $GITHUB_STEP_SUMMARY
          else
            echo "Falha ao gerar relatorio" >> $GITHUB_STEP_SUMMARY
          fi

  testes-ui:
    name: Testes de UI (Cypress)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v5
        continue-on-error: true
        with:
          browser: chrome
          headed: false
          config-file: cypress.config.js
          spec: tests/ui/cypress/e2e/*.cy.js
        env:
          CYPRESS_baseUrl: https://front.serverest.dev
          CYPRESS_apiUrl: https://serverest.dev

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: tests/ui/cypress/screenshots/
          retention-days: 30

      - name: Upload vídeos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: tests/ui/cypress/videos/
          retention-days: 30

      - name: Publicar resumo dos testes
        if: always()
        run: |
          echo "## Resultados dos Testes de UI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Testes executados" >> $GITHUB_STEP_SUMMARY
          echo "Videos e screenshots salvos nos artefatos" >> $GITHUB_STEP_SUMMARY

  resumo-final:
    name: Resumo da Execução
    runs-on: ubuntu-latest
    needs: [testes-api, testes-ui]
    if: always()

    steps:
      - name: Gerar resumo final
        run: |
          echo "# Resumo da Execucao de Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status dos Jobs:" >> $GITHUB_STEP_SUMMARY
          echo "- **Testes API**: ${{ needs.testes-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Testes UI**: ${{ needs.testes-ui.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artefatos Gerados:" >> $GITHUB_STEP_SUMMARY
          echo "- Relatorios Karate" >> $GITHUB_STEP_SUMMARY
          echo "- Videos Cypress" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots (se houver falhas)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Executado em: $(date)*" >> $GITHUB_STEP_SUMMARY
