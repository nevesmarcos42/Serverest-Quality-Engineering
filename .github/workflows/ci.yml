name: CI/CD - Testes Automatizados

# Define quando a pipeline será executada
on:
  push:
    branches: [main, develop] # Executa em push para as branches main e develop
  pull_request:
    branches: [main, develop] # Executa em pull requests para main e develop

# Define as permissões necessárias
permissions:
  contents: read
  pull-requests: read

# Define os jobs da pipeline
jobs:
  # ====================================
  # JOB 1: Testes de API com Karate
  # ====================================
  api-tests:
    name: Testes de API (Karate)
    runs-on: ubuntu-latest # Usa a versão mais recente do Ubuntu

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Java 11 (necessário para o Karate/Maven)
      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin" # Usa a distribuição Eclipse Temurin (OpenJDK)
          cache: "maven" # Habilita cache de dependências Maven para acelerar builds

      # 3. Executa os testes de API com Maven
      - name: Executar testes de API
        run: mvn clean test -Dtest=TestRunner
        continue-on-error: false # Se os testes falharem, o job falha

      # 4. Faz upload dos relatórios do Karate como artefato
      - name: Upload dos relatórios Karate
        if: always() # Executa mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports/
          retention-days: 30 # Mantém os artefatos por 30 dias

  # ====================================
  # JOB 2: Testes de UI com Cypress
  # ====================================
  ui-tests:
    name: Testes de UI (Cypress)
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Node.js LTS (necessário para o Cypress)
      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*" # Usa a última versão LTS do Node.js
          cache: "npm" # Habilita cache de dependências npm para acelerar builds

      # 3. Instala as dependências do projeto
      - name: Instalar dependências
        run: npm ci # npm ci é mais rápido e confiável que npm install em CI

      # 4. Executa os testes Cypress em modo headless
      - name: Executar testes de UI
        run: npm run test:ui
        continue-on-error: false # Se os testes falharem, o job falha

      # 5. Faz upload dos vídeos dos testes (gerados pelo Cypress)
      - name: Upload dos vídeos dos testes
        if: always() # Executa mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: tests/ui/cypress/videos/
          retention-days: 30

      # 6. Faz upload dos screenshots (gerados em caso de falha)
      - name: Upload dos screenshots de falhas
        if: failure() # Executa apenas se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/ui/cypress/screenshots/
          retention-days: 30

  # ====================================
  # JOB 3: Resumo dos Resultados
  # ====================================
  test-summary:
    name: Resumo dos Testes
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests] # Aguarda os dois jobs de teste terminarem
    if: always() # Executa mesmo se algum job anterior falhar

    steps:
      - name: Pipeline concluída
        run: |
          echo "=========================================="
          echo "Resumo da execução dos testes:"
          echo "=========================================="
          echo "- Testes de API (Karate): ${{ needs.api-tests.result }}"
          echo "- Testes de UI (Cypress): ${{ needs.ui-tests.result }}"
          echo "=========================================="

          # Falha o job se algum teste falhou
          if [ "${{ needs.api-tests.result }}" != "success" ] || [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "ERRO: Alguns testes falharam!"
            exit 1
          else
            echo "SUCESSO: Todos os testes passaram com sucesso!"
          fi
